name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (MSRV 1.89)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test (MSRV 1.89)
        run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci
      # High or critical advisories fail CI, even with no code change (accepted).
      - name: npm audit
        run: npm audit --audit-level=high
      - name: build (fails on external script or style addresses)
        run: npm run build
      - name: dist stays out of git
        run: test -z "$(git ls-files dist node_modules)"
      - name: AG-UI samples match @ag-ui/core
        run: npm run gen-fixtures && git diff --exit-code ../tests/fixtures/agui-events.json

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
